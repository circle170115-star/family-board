<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>living 1280×800 검증용 미리보기</title>
<style>
  html,body{margin:0;background:#e7edf6;font-family:sans-serif}
  .stage{width:1280px;height:800px;margin:14px auto;background:#fff;box-shadow:0 20px 60px -30px rgba(0,0,0,.45)}
  iframe{display:block;width:1280px;height:800px;border:0}
  #log{position:fixed;right:8px;top:8px;font:12px/1.4 monospace;background:#fff;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
<div class="stage"><iframe id="f" src="living.html" title="거실 등원 보드 1280x800"></iframe></div>
<div id="log">errors: 0</div>
<script>
  var errs = [];
  var f = document.getElementById('f');
  function bump(){ document.getElementById('log').textContent = 'errors: ' + errs.length + (errs.length ? ' · ' + errs[0] : ''); }
  f.addEventListener('load', function () {
    try {
      f.contentWindow.addEventListener('error', function (e) { errs.push(String(e.message)); bump(); });
      f.contentWindow.addEventListener('unhandledrejection', function () { errs.push('unhandled rejection'); bump(); });
    } catch (e) { errs.push('attach fail'); bump(); }
  });
</script>
</body>
</html>
