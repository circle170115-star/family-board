<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>touch hold test (임시 검증용)</title>
<style>
  body{font:13px/1.6 ui-monospace,monospace;padding:12px}
  iframe{width:1180px;height:760px;border:1px solid #ccc;display:block;margin-bottom:10px}
  pre{background:#111;color:#cff;padding:10px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f" src="living.html?touchcheck=1"></iframe>
<pre id="log">loading…</pre>
<script>
const L = [];
const log = (s) => { L.push(s); document.getElementById("log").textContent = L.join("\n"); console.log(s); };
const f = document.getElementById("f");
let started = false, navigated = false, phaseNo = 0;

f.addEventListener("load", () => {
  let href = "?";
  try { href = f.contentWindow.location.pathname; } catch (e) {}
  if (href.indexOf("index.html") > -1) {
    navigated = true;
    log("TOUCH LONG: ✅ 2초 넘게 누르자 모아보드로 이동함 → " + href);
    return;
  }
  if (!started) { started = true; main(); }
});

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function waitReady() {
  for (let i = 0; i < 60; i++) {
    try {
      if (f.contentDocument.querySelector(".kid") && f.contentDocument.getElementById("homeLink")) {
        await sleep(300); return true;
      }
    } catch (e) {}
    await sleep(100);
  }
  return false;
}

function touch(a, type) {
  const W = f.contentWindow;
  const t = new W.Touch({ identifier: 1, target: a, clientX: 10, clientY: 10, pageX: 10, pageY: 10 });
  const list = type === "touchend" || type === "touchcancel" ? [] : [t];
  a.dispatchEvent(new W.TouchEvent(type, {
    bubbles: true, cancelable: true,
    touches: list, targetTouches: list, changedTouches: [t]
  }));
}

function hold(a, ms) {
  touch(a, "touchstart");
  const holding = a.classList.contains("is-holding");
  return new Promise((res) => setTimeout(() => {
    if (!navigated) touch(a, "touchend");
    res(holding);
  }, ms));
}

async function main() {
  if (!(await waitReady())) return log("FAIL: 보드가 준비되지 않음");
  log("ready");

  // 1) 짧은 탭(0.12초)
  let a = f.contentDocument.getElementById("homeLink");
  const h1 = await hold(a, 120);
  await sleep(200);
  const t1 = f.contentDocument.getElementById("toast");
  log("TOUCH TAP(0.12s): url=" + f.contentWindow.location.pathname +
      " / holding표시=" + h1 +
      " / toast=" + JSON.stringify(t1 ? t1.textContent : null));

  await sleep(2200);

  // 2) 길게 누르기(2.6초)
  a = f.contentDocument.getElementById("homeLink");
  if (!a) return log("FAIL: 두 번째 시도에서 #homeLink 없음");
  const h2 = await hold(a, 2600);
  await sleep(900);
  if (!navigated) log("TOUCH LONG: ❌ 이동하지 않음 (url=" + f.contentWindow.location.pathname + " / holding표시=" + h2 + ")");
}
</script>
</body>
</html>
