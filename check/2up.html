<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>임시 검증 · 거실 보드 루틴 8개</title>
<style>
  body{margin:0;background:#222;color:#fff;font:14px/1.4 -apple-system,system-ui,sans-serif}
  .case{padding:10px}
  .cap{font-weight:700;padding:6px 2px}
  iframe{border:0;display:block;background:#fff}
  #c1{width:1280px;height:800px}
  #c2{width:1024px;height:600px}
</style>
</head>
<body>
  <div class="case"><div class="cap">A · 1280×800 · 아침</div><iframe id="c1" src="../living.html?cb=20261119n" title="1280x800 morning"></iframe></div>
  <div class="case"><div class="cap">B · 1024×600 · 저녁</div><iframe id="c2" src="../living.html?cb=20261119n" title="1024x600 evening"></iframe></div>
<script>
  function setTab(id, part) {
    const fr = document.getElementById(id);
    const d = fr && fr.contentDocument;
    if (!d) return;
    const tabs = d.querySelectorAll('.kid-tab[data-part="' + part + '"]');
    tabs.forEach((b) => b.click());
  }
  document.getElementById('c1').addEventListener('load', () => setTimeout(() => setTab('c1', 'morning'), 1200));
  document.getElementById('c2').addEventListener('load', () => setTimeout(() => setTab('c2', 'evening'), 1400));
</script>
</body>
</html>
